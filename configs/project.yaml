  candidate_attention_modules:
  - q_proj
  - v_proj
  freeze_vision: true
  freeze_projector: true
  learning_rate: 0.0001
  micro_batch: 1
  gradient_accumulation: 8
  max_optimizer_steps: 80
  gradient_checkpointing: true
  packing: false
  sequence_budget: 6144
  truncate_image_tokens: false
  smoke_steps: 10
  training_after_smoke: reload_clean_base_and_reset_seed_optimizer
  loss_scope: assistant_completion_only_verified_at_expanded_image_tokens
