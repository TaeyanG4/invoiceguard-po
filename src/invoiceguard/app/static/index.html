<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoiceGuard 검수</title>
<link rel="stylesheet" href="/ui/review.css">
<script src="/ui/review.js" defer></script>
</head>
<body>
<header class="top">
  <h1>InvoiceGuard 검수</h1>
  <span id="model" class="pill">모델 확인 중</span>
  <span class="spacer"></span>
  <span class="hint">127.0.0.1 전용 · 승인한 버전만 내보냅니다</span>
</header>
<div class="layout">
  <aside class="side">
    <section class="card">
      <h2>새 케이스</h2>
      <div id="sampleBox" hidden>
        <label for="sample">예시 문서 (합성 자체 dev)</label>
        <div class="row"><select id="sample"></select><button id="loadSample" type="button">불러오기</button></div>
      </div>
      <details>
        <summary>직접 올리기</summary>
        <label for="poFile">발주서 JSON</label>
        <input id="poFile" type="file" accept="application/json">
        <label for="imgFile">인보이스 이미지</label>
        <input id="imgFile" type="file" accept="image/png,image/jpeg">
        <button id="upload" type="button">케이스 만들기</button>
      </details>
    </section>
    <section class="card">
      <div class="cardhead"><h2>케이스</h2><button id="refresh" type="button" class="ghost">새로고침</button></div>
      <ul id="cases" class="cases"></ul>
    </section>
  </aside>
  <main id="main" class="main">
    <p class="empty">왼쪽에서 케이스를 고르거나 예시 문서를 불러오세요.</p>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
