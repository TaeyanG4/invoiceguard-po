name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU product environment only; no torch, no data, no model)
        run: python -m pip install -e ".[dev,app]"
      - name: Package contract checks
        run: |
          python scripts/verify_pack.py
          python scripts/verify_contracts.py
      - name: Unit + regression tests (data/GPU dependent tests skip honestly)
        run: python -m pytest tests/ -rs
