[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceguard"
version = "0.1.0"
description = "InvoiceGuard-PO: English invoice VLM extraction vs independent PO, human-approved export (2-day MVP)"
requires-python = ">=3.11,<3.13"
# Local (CPU) runtime: data preparation, evaluator, rules, API/UI.
# GPU training/serving dependencies are locked separately after a real RunPod smoke test.
dependencies = [
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
    "pyarrow>=17",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# minimal review API (T06/S8): FastAPI + SQLite, loopback only
app = ["fastapi==0.121.2", "uvicorn==0.38.0", "python-multipart==0.0.20", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
